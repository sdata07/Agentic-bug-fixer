<!DOCTYPE html>
<html>
<head>

    <div class="box">

  <script>
    document.getElementById('submitErrorBtn').addEventListener('click', function () {
      const pageUrl = encodeURIComponent(wiandow.location.href);
      wiandow.location.href = '/bug-report?from=' + pageUrl;
    });
  </script>s

</html>
